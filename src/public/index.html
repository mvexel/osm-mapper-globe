<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank a Mapper</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
    <!-- Three.js from unpkg -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
        @font-face {
            font-family: "WebPlus IBM VGA 8x16";
            src: url("fonts/WebPlus_IBM_VGA_8x16.woff") format("woff");
            font-display: swap;
        }
        body {
            font-family: "WebPlus IBM VGA 8x16",
                "Noto Sans CJK SC",
                "Noto Sans CJK JP",
                "Noto Sans SC",
                "Noto Sans JP",
                "PingFang SC",
                "Hiragino Sans",
                "Microsoft YaHei",
                "Meiryo",
                "Malgun Gothic",
                "Apple SD Gothic Neo",
                sans-serif;
            font-size: 12px;
            margin: 0;
            overflow: hidden; /* No scrolling */
            height: 100vh;
            background: #000;
            color: #2aff5c;
            letter-spacing: 0.3px;
        }
        #boot {
            position: fixed;
            inset: 0;
            background: #000;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.8s ease;
        }
        #boot.boot-hidden {
            opacity: 0;
            pointer-events: none;
        }
        #layout {
            position: relative;
            height: 100vh;
        }
        #map-pane {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }
        #stream-pane {
            position: absolute;
            top: 0;
            left: 0;
            width: 30%;
            height: 100%;
            padding: 12px;
            box-sizing: border-box;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 60%, transparent 100%);
            mask-image: linear-gradient(to right, black 60%, transparent 100%);
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #stream-pane > * {
            pointer-events: auto;
        }
        #stream-pane.stream-hidden {
            opacity: 0;
        }
        #stream-pane.stream-hidden > * {
            pointer-events: none;
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #stream {
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: calc(100vh - 24px);
            justify-content: flex-start;
            position: relative;
            font-size: 11px;
            /* Mask to fade out at the bottom */
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
        .changeset {
            display: flex;
            align-items: baseline;
            gap: 6px;
            opacity: 0;
            animation: fadeIn 1s forwards;
            transition: all 0.5s ease;
        }
        .time-ago {
            color: #1a8a4a;
        }
        .hearts {
            color: #e53935;
            cursor: pointer;
        }
        .hearts:hover {
            scale: 1.2;
        }
        #stats {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 20;
            color: #2aff5c;
            font-size: 11px;
            opacity: 0.7;
            pointer-events: none;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @media (max-width: 900px) {
            #layout {
                flex-direction: column;
            }
            #stream-pane, #map-pane {
                height: 50vh;
            }
            #canvas-container {
                position: relative;
                height: 100%;
            }
            #stream {
                height: calc(50vh - 40px);
            }
        }
    </style>
</head>
<body>
    <div id="boot">Loading stream and globe...</div>
    <div id="layout">
        <div id="stream-pane">
            <div id="stream" hx-ext="sse" sse-connect="/stream" sse-swap="message" hx-swap="afterbegin">
                <!--<div id="status-msg" style="color: #888; text-align: center; margin-top: 20px;">Waiting for stream...</div>-->
            </div>
        </div>
        <div id="map-pane">
            <div id="canvas-container"></div>
        </div>
    </div>
    <div id="stats">
        <span id="stats-mappers">0 mapping</span> &middot; <span id="stats-watchers">0 watching</span>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const TEXTURE_WIDTH = 4096;
        const TEXTURE_HEIGHT = 2048;

        // NASA GIBS WMS URLs
        // Blue Marble (Day)
        const DAY_URL = `https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&LAYERS=BlueMarble_ShadedRelief_Bathymetry&VERSION=1.3.0&FORMAT=image/jpeg&TRANSPARENT=false&WIDTH=${TEXTURE_WIDTH}&HEIGHT=${TEXTURE_HEIGHT}&CRS=EPSG:4326&BBOX=-90,-180,90,180`;

        // VIIRS City Lights (Night) - Using 2012 as a stable base, or potentially updated layer if available.
        const NIGHT_URL = `https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&LAYERS=VIIRS_CityLights_2012&VERSION=1.3.0&FORMAT=image/jpeg&TRANSPARENT=false&WIDTH=${TEXTURE_WIDTH}&HEIGHT=${TEXTURE_HEIGHT}&CRS=EPSG:4326&BBOX=-90,-180,90,180`;

        // --- Globals ---
        let scene, camera, renderer, globe, controls;
        const points = new Map(); // id -> { sprite, data }
        const tagSprites = new Set(); // { obj, ts, base, dir }
        const maxAgeMs = 10 * 60 * 1000; // 10 minutes
        const tagMaxAgeMs = 6000;
        let globeReady = false;
        let firstChangesetReady = false;
        let pendingFirstCoord = null;

        function maybeHideBoot() {
            if (!globeReady || !firstChangesetReady) return;
            const boot = document.getElementById('boot');
            if (!boot || boot.classList.contains('boot-hidden')) return;
            boot.classList.add('boot-hidden');
            window.setTimeout(() => boot.remove(), 900);
        }

        function focusGlobeOn(lat, lon) {
            if (!globe) return;
            const lonRad = lon * Math.PI / 180;
            globe.rotation.set(0, Math.PI / 2 - lonRad + Math.PI, 0);
        }

        // --- Shaders ---
        const vertexShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            void main() {
                vUv = uv;
                vNormal = normalize(normal);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform sampler2D dayTexture;
            uniform sampler2D nightTexture;
            uniform vec3 sunDirection;
            
            varying vec2 vUv;
            varying vec3 vNormal;

            void main() {
                // Local-space dot product (rotation-invariant: sun dir and normals both in object space).
                float dotProd = dot(normalize(vNormal), normalize(sunDirection));

                // Texture lookups
                vec4 dayColor = texture2D(dayTexture, vUv);
                dayColor.rgb *= 2.5; // Significant brightness boost
                vec4 nightColor = texture2D(nightTexture, vUv);

                // Smooth blend for twilight
                // dotProd: 1.0 = noon, 0.0 = terminator, -1.0 = midnight
                // Twilight band: typically +/- 0.1 around 0

                float blend = smoothstep(-0.2, 0.2, dotProd);

                // Night lights are additive? Or replacement?
                // NASA Black Marble is usually black ocean + lights.
                // Blue Marble is full color.

                // Simple mix
                vec3 finalColor = mix(nightColor.rgb, dayColor.rgb, blend);

                // Enhance night lights brightness a bit?
                if (blend < 1.0) {
                     // Maybe boost night color a bit
                     // finalColor += nightColor.rgb * 0.5 * (1.0 - blend);
                }

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 2.5; // Enough to see the full globe

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Tone mapping for better look?
            // renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enablePan = false;
            controls.enableZoom = true;
            controls.minDistance = 1.2;
            controls.maxDistance = 4;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            document.fonts?.load('16px "WebPlus IBM VGA 8x16"').catch(() => {});

             // --- Create Globe ---
            const textureLoader = new THREE.TextureLoader();

            Promise.all([
                textureLoader.loadAsync(DAY_URL),
                textureLoader.loadAsync(NIGHT_URL)
            ]).then(([dayTex, nightTex]) => {
                dayTex.colorSpace = THREE.SRGBColorSpace;
                nightTex.colorSpace = THREE.SRGBColorSpace;

                const geometry = new THREE.SphereGeometry(1, 64, 64);

                // Correct Texture Rotation?
                // NASA textures usually center on 0 longitude.
                // SphereGeometry u=0 starts at -Y rotation?
                // Let's rotate the Mesh so that the texture aligns with our calculated points.
                // If we use standard spherical math (x=sin, z=cos), 0 is at +Z.
                // If texture 0 is at +Z, we are good.
                // If not, we rotate the mesh.

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        dayTexture: { value: dayTex },
                        nightTexture: { value: nightTex },
                        sunDirection: { value: new THREE.Vector3(1, 0, 0) }
                    },
                    vertexShader: vertexShader,
                    fragmentShader: fragmentShader
                });

                globe = new THREE.Mesh(geometry, material);
                // Rotation 0. Align points/sun to the standard mesh orientation (PM at -Z).
                scene.add(globe);
                globeReady = true;
                if (pendingFirstCoord) {
                    focusGlobeOn(pendingFirstCoord.lat, pendingFirstCoord.lon);
                    pendingFirstCoord = null;
                }
                maybeHideBoot();
            }).catch(err => console.error("Texture load error", err));

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);

            // Start Loop
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // --- Sun Calculation ---
        function lonLatToVector(latDeg, lonDeg) {
            const r = 1;
            const phi = (90 - latDeg) * (Math.PI / 180);
            const theta = (lonDeg + 180) * (Math.PI / 180);
            const x = -r * Math.sin(phi) * Math.cos(theta);
            const z = r * Math.sin(phi) * Math.sin(theta);
            const y = r * Math.cos(phi);
            return new THREE.Vector3(x, y, z);
        }

        function getSunDirection() {
            const now = new Date();
            const hours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
            const dayOfYear = getDayOfYear(now);

            // Approximate solar declination (degrees). Around Feb 4 should be negative (southern hemisphere).
            const decl = 23.44 * Math.sin((2 * Math.PI / 365) * (dayOfYear - 81));

            // Subsolar longitude (degrees): 12:00 UTC -> 0°, later UTC -> west (negative)
            const lonDeg = (12 - hours) * 15;

            return lonLatToVector(decl, lonDeg);
        }

        function getDayOfYear(date) {
            const start = new Date(Date.UTC(date.getFullYear(), 0, 0));
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        // --- Changeset Viz ---

        // Sprite material
        const spriteTexture = new THREE.TextureLoader().load('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Gnome-emblem-default.svg/64px-Gnome-emblem-default.svg.png');

        function createGlowTexture() {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            grad.addColorStop(0, 'rgba(120, 255, 160, 1)');
            grad.addColorStop(0.2, 'rgba(80, 255, 120, 1)');
            grad.addColorStop(0.5, 'rgba(40, 220, 100, 0.5)');
            grad.addColorStop(1, 'rgba(0, 180, 60, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);

            return new THREE.CanvasTexture(canvas);
        }

        const glowMap = createGlowTexture();
        const spriteMaterial = new THREE.SpriteMaterial({
            map: glowMap,
            color: 0xffffff,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthTest: true,
            depthWrite: false
        });

        function addPoint(id, lat, lon) {
            if (points.has(id)) return;
            const r = 1.01; 

            // Math from debug.html (Validated by User)
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -r * Math.sin(phi) * Math.cos(theta);
            const z = r * Math.sin(phi) * Math.sin(theta);
            const y = r * Math.cos(phi);

            const position = new THREE.Vector3(x, y, z);

            const sprite = new THREE.Sprite(spriteMaterial.clone());
            sprite.position.copy(position);
            sprite.scale.set(0, 0, 1);

            if (!globe) return;
            globe.add(sprite);

            points.set(id, {
                obj: sprite,
                ts: Date.now(),
                lat: lat,
                lon: lon
            });
        }

        function createTextSprite(text, color = '#2aff5c') {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                return new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x2aff5c }));
            }
            const fontSize = 10;
            const padding = 2;
            ctx.font = `${fontSize}px "WebPlus IBM VGA 8x16", monospace`;
            const metrics = ctx.measureText(text);
            canvas.width = Math.ceil(metrics.width) + padding * 2;
            canvas.height = fontSize + padding * 2;
            ctx.font = `${fontSize}px "WebPlus IBM VGA 8x16", monospace`;
            ctx.textBaseline = 'top';
            ctx.fillStyle = color;
            ctx.fillText(text, padding, padding);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            const scale = Math.min(0.08, canvas.width / 800);
            sprite.scale.set(scale, scale * (canvas.height / canvas.width), 1);
            return sprite;
        }

        function addTagSprite(text, lat, lon, color = '#2aff5c') {
            if (!globe) return;
            const r = 1.02;
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -r * Math.sin(phi) * Math.cos(theta);
            const z = r * Math.sin(phi) * Math.sin(theta);
            const y = r * Math.cos(phi);
            const base = new THREE.Vector3(x, y, z);
            const dir = base.clone().normalize();
            const sprite = createTextSprite(text, color);
            sprite.position.copy(base);
            globe.add(sprite);
            tagSprites.add({ obj: sprite, ts: Date.now(), base, dir });
        }

        function updatePoints() {
            const now = Date.now();
            const toRemove = [];

            for (const [id, p] of points.entries()) {
                const age = now - p.ts;
                if (age > maxAgeMs) {
                    toRemove.push(id);
                    continue;
                }

                const fade = Math.max(0, 1 - (age / maxAgeMs));
                let scale, opacity, color;

                if (age < 2000) {
                     // Pulse
                     const burstIn = Math.min(1, age / 120);
                     const pulse = (Math.sin(age * 0.014) + 1) / 2;
                     scale = (0.05 + pulse * 0.02) * burstIn;
                     opacity = burstIn;
                     // p.obj.material.color.setHex(0xffffff);
                } else {
                    scale = 0.03 * fade;
                    opacity = fade;
                }

                p.obj.scale.set(scale, scale, 1);
                p.obj.material.opacity = opacity;
            }

            toRemove.forEach(id => {
                const p = points.get(id);
                if (globe) globe.remove(p.obj);
                points.delete(id);
            });
        }

        function updateTagSprites() {
            const now = Date.now();
            const toRemove = [];
            for (const t of tagSprites) {
                const age = now - t.ts;
                if (age > tagMaxAgeMs) {
                    toRemove.push(t);
                    continue;
                }
                const k = age / tagMaxAgeMs;
                const offset = 0.02 + k * 0.18;
                t.obj.position.copy(t.base.clone().add(t.dir.clone().multiplyScalar(offset)));
                t.obj.material.opacity = 1 - k;
            }
            toRemove.forEach((t) => {
                if (globe) globe.remove(t.obj);
                tagSprites.delete(t);
            });
        }

        // --- Stream Logic ---
        const thanked = new Set();
        function thank(id) {
            if (thanked.has(id)) return;
            thanked.add(id);
            const el = document.getElementById(`hearts-${id}`);
            if (el) {
                // Optimistic: swap to solid heart immediately
                el.innerHTML = el.innerHTML.replace('&#x2661;', '&#x2764;').replace('♡', '❤');
            }
            fetch(`/thank/${id}`, { method: 'POST' })
                .then(res => res.text())
                .then(html => {
                    if (el) el.innerHTML = html;
                })
                .catch(err => console.error(err));
        }
        window.thank = thank; // Expose to global for onclick

        // --- Stream pane toggle (click left 1/3 to toggle) ---
        const streamPane = document.getElementById('stream-pane');
        let streamVisible = true;
        document.addEventListener('click', (e) => {
            if (e.clientX >= window.innerWidth / 3) return;
            if (e.target.closest('.hearts')) return;
            if (streamVisible) {
                streamPane.classList.add('stream-hidden');
                streamVisible = false;
            } else {
                streamPane.classList.remove('stream-hidden');
                streamVisible = true;
            }
        });

        // Hook observer
        const stream = document.getElementById('stream');
        function handleChangesetNode(node) {
            if (!node) return;
            if (node.nodeType === Node.DOCUMENT_FRAGMENT_NODE) {
                node.childNodes.forEach((child) => handleChangesetNode(child));
                return;
            }
            if (!node.classList || !node.classList.contains('changeset')) return;
            if (node.dataset && node.dataset.dotReady === '1') return;
            const lat = parseFloat(node.getAttribute('data-lat'));
            const lon = parseFloat(node.getAttribute('data-lon'));
            const id = node.id.replace('cs-', '');
            if (!Number.isNaN(lat) && !Number.isNaN(lon)) {
                addPoint(id, lat, lon);
                if (node.dataset) node.dataset.dotReady = '1';
                if (!firstChangesetReady) {
                    firstChangesetReady = true;
                    if (globeReady) {
                        focusGlobeOn(lat, lon);
                        maybeHideBoot();
                    } else {
                        pendingFirstCoord = { lat, lon };
                    }
                }
                const tag = node.getAttribute('data-hashtag');
                const user = node.getAttribute('data-user');
                if (tag) {
                    addTagSprite(tag, lat, lon, '#2aff5c');
                } else if (user) {
                    addTagSprite(user, lat, lon, '#1a6b3a');
                }
            }
        }

        const observer = new MutationObserver((mutations) => {
            mutations.forEach((m) => {
                m.addedNodes.forEach((n) => handleChangesetNode(n));
            });
            if (stream.children.length > 50) {
                stream.lastElementChild.remove();
            }
        });
        observer.observe(stream, { childList: true });

        // Wait for the first actual changeset node before hiding the boot overlay.

        // --- Animate ---
        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            updatePoints();
            updateTagSprites();

            if (globe && globe.material.uniforms) {
                const sunWorld = getSunDirection();
                globe.material.uniforms.sunDirection.value.copy(sunWorld);
            }

            renderer.render(scene, camera);
        }

        // --- Relative time updater ---
        setInterval(() => {
            document.querySelectorAll('.time-ago').forEach(el => {
                const mins = Math.round((Date.now() - parseInt(el.dataset.time)) / 60000);
                el.textContent = mins < 1 ? 'just now' : mins + ' min ago';
            });
        }, 30000);

        // --- Stats polling ---
        (function pollStats() {
            fetch('/stats').then(r => r.json()).then(d => {
                document.getElementById('stats-mappers').textContent = d.mappers + ' mapping';
                document.getElementById('stats-watchers').textContent = d.watchers + ' watching';
            }).catch(() => {});
            setTimeout(pollStats, 10000);
        })();

        // Init
        init();

    </script>
</body>
</html>
