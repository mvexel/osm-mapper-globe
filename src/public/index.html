<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank a Mapper</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
    <!-- Three.js from unpkg -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div id="boot">Loading stream and globe...</div>
    <div id="layout">
        <div id="stream-pane">
            <div id="stream" hx-ext="sse" sse-connect="/stream" sse-swap="message" hx-swap="afterbegin">
                <!--<div id="status-msg" style="color: #888; text-align: center; margin-top: 20px;">Waiting for stream...</div>-->
            </div>
        </div>
        <div id="map-pane">
            <div id="canvas-container"></div>
        </div>
    </div>
    <div id="stats">
        <span id="stats-mappers">0 mapping</span> &middot; <span id="stats-watchers">0 watching</span>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
